[build-system]
requires = ["hatchling==1.32.0", "editables==0.6"]
build-backend = "hatchling.build"

[project]
name = "entity-resolution-workbench"
version = "0.1.0"
description = "Deterministic local workbench for explainable catalogue entity resolution"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
erw = "entity_resolution_workbench.cli:main"

[dependency-groups]
build = [
  "hatchling==1.32.0",
  "editables==0.6",
]
dev = [
  "mypy==2.3.1",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.5",
]
audit = [
  "pip-audit==2.10.0",
]

[tool.hatch.build.targets.sdist]
exclude = ["/evidence"]

[tool.hatch.build.targets.wheel]
packages = ["src/entity_resolution_workbench"]

[tool.hatch.build.targets.wheel.force-include]
"pyproject.toml" = "entity_resolution_workbench/_provenance/pyproject.toml"
"uv.lock" = "entity_resolution_workbench/_provenance/uv.lock"

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["entity_resolution_workbench"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
